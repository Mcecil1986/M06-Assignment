<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>
<body>
    <h1>Student Information</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Student Name:</label><br>
        <input type="text" name="student_name"><br><br>

        <label>Student ID:</label><br>
        <input type="text" name="student_id"><br><br>

        <label>Major:</label><br>
        <select name="major">
            <option value="Computer Science">Computer Science</option>
            <option value="Business">Business</option>
            <option value="Nursing">Nursing</option>
            <option value="Engineering">Engineering</option>
        </select><br><br>

        <label>Class Standing:</label><br>
        <input type="radio" name="standing" value="Freshman"> Freshman<br>
        <input type="radio" name="standing" value="Sophomore"> Sophomore<br>
        <input type="radio" name="standing" value="Junior"> Junior<br>
        <input type="radio" name="standing" value="Senior"> Senior<br><br>

        <label>Programming Languages Known:</label><br>
        <input type="checkbox" name="languages" value="Python"> Python<br>
        <input type="checkbox" name="languages" value="Java"> Java<br>
        <input type="checkbox" name="languages" value="C++"> C++<br>
        <input type="checkbox" name="languages" value="JavaScript"> JavaScript<br><br>

        <label>Expected Graduation Year:</label><br>
        <input type="number" name="grad_year"><br><br>

        <label>Comments:</label><br>
        <textarea name="comments" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
